name: Update FUJI scores (6/10)

on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:

jobs:
  update-fuji-score:
    runs-on: ubuntu-latest

    services:
      fujirest:
        image: ghcr.io/pangaea-data-publisher/fuji:latest
        ports:
          - 1071:1071
        env:
          ENABLE_CORS: "true"

    env:
      FUJI_URL: http://localhost:1071

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FUJI score update
        run: npx --yes tsx@4.21.0 scripts/schedule/update-fuji-score.ts
