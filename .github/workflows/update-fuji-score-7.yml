name: Update FUJI scores (7/10)

on:
  schedule:
    - cron: "30 */8 * * *"
  workflow_dispatch:

jobs:
  update-fuji-score:
    runs-on: ubuntu-latest

    services:
      fujirest:
        image: ghcr.io/pangaea-data-publisher/fuji:latest
        ports:
          - 1071:1071
        env:
          ENABLE_CORS: "true"

    env:
      FUJI_URL: http://localhost:1071

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FUJI score update
        run: pnpm tsx scripts/schedule/update-fuji-score.ts
