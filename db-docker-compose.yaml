services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: s_index_local
    ports:
      - 100.96.211.6:43997:5432
    volumes:
      # - postgres_data:/var/lib/postgresql/data # postgres 17- data directory
      - postgres_data:/var/lib/postgresql # postgres 18 data directory

  redis:
    image: redis:latest
    restart: always
    ports:
      - 100.96.211.6:44001:6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
