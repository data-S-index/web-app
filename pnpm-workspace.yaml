allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# setting the minimum release age to 5 days (7200 minutes) to ensure that releases are stable before being used in the workspace
minimumReleaseAge: 7200
blockExoticSubdeps: true
minimumReleaseAgeStrict: true # tracked in https://github.com/pnpm/pnpm/issues/11238

minimumReleaseAgeExclude:
  - "@nuxt/ui@4.13.0" # Security patch for GHSA-x9jw-j844-v24h